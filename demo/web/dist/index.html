<!doctype html>
<html lang="en" data-flavor="flat">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacetime Authz</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --panel2: #efede8; --fg: #1d1c1a; --muted: #6b6862; --line: #dedad2;
  --accent: #5b5bd6; --accent-fg: #ffffff; --ok: #1f8a4c; --bad: #c2410c; --chip: #ecebfb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121316; --panel: #1b1d21; --panel2: #23262b; --fg: #ecebe8; --muted: #9a978f; --line: #2d3036;
    --accent: #8b8bf0; --accent-fg: #14142b; --ok: #3ddc84; --bad: #ff9a5c; --chip: #2a2a48;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; font-weight: 650; display: flex; align-items: center; gap: 8px; }
header h1 svg { color: var(--accent); }
#status { font-size: 13px; color: var(--ok); }
#status.bad { color: var(--bad); }
.me { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pill { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 53px); }
aside { border-right: 1px solid var(--line); padding: 16px 12px; background: var(--panel); display: flex; flex-direction: column; gap: 4px; }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 4px 8px 6px; }
.scope { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; text-align: left; }
.scope:hover, .scope.active { background: var(--panel2); }
.scope.active { font-weight: 600; }
.scope svg { color: var(--muted); flex: none; }
.scope.active svg { color: var(--accent); }
.empty { color: var(--muted); font-size: 13px; padding: 4px 10px; }
form.inline { display: flex; gap: 6px; margin-top: 8px; }
form.inline input { flex: 1; min-width: 0; }
input[type=text], select, textarea { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
textarea { width: 100%; min-height: 60px; resize: vertical; }
button.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button.small { padding: 2px 9px; font-size: 12px; }
main { padding: 22px 28px 60px; min-width: 0; }
.crumbs { color: var(--muted); font-size: 13px; }
h2.title { margin: 2px 0 6px; font-size: 24px; letter-spacing: -0.02em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 16px; }
.chip { background: var(--chip); color: var(--fg); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.chip.role { background: var(--accent); color: var(--accent-fg); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tab { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
.tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 8px; font-size: 15px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.perms { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px 12px; margin: 8px 0; font-size: 13px; }
.perms label { display: flex; gap: 6px; align-items: center; }
.form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.link { word-break: break-all; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
#toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-8px); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; pointer-events: none; transition: 0.15s; z-index: 10; }
#toast.show { opacity: 1; transform: translateX(-50%); }
#toast.bad { background: var(--bad); color: #fff; }
.welcome { max-width: 560px; }
[hidden] { display: none !important; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 18px 16px 60px; }
}
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.3 8.3 8 9 4.7-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg> Spacetime Authz</h1>
  <span id="status">connecting…</span>
  <span class="me"><span class="mono muted" id="my-id" title="Your identity (click to copy)"></span><button class="pill" id="my-name" title="Change your name">…</button></span>
</header>
<div class="layout">
  <aside>
    <h2>Your workspaces</h2>
    <div id="tree"></div>
    <form class="inline" id="new-ws"><input id="new-ws-name" type="text" placeholder="New workspace" maxlength="64" required><button class="btn primary">Create</button></form>
    <form class="inline" id="redeem"><input id="redeem-code" type="text" placeholder="Invite code" required><button class="btn">Join</button></form>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>
